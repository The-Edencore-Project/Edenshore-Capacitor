<!DOCTYPE html>
<html>
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0, maximum‑scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splashScreen">Edencore Reef Aquarium</div>
<div id="gameCanvas">
    <div class="hud">
        BOND: 0 - Stranger
        <div class="buttonRow">
            <div class="btn" id="feedBtn">FEED</div>
            <div class="btn" id="sleepBtn">SLEEP</div>
            <div class="btn">DIM</div>
            <div class="btn">VOL HI</div>
            <div class="btn">MENU</div>
        </div>
    </div>

    <div id="solonWrapper" class="creature">
        <img id="solon" src="assets/images/solon.png">
    </div>
    <img id="vertex" class="creature" src="assets/images/vertex.png">
    <img id="ripple" class="creature" src="assets/images/ripple.png">
    <img id="prism" class="creature" src="assets/images/prism.png">
    <img id="lumen" class="creature" src="assets/images/lumen.png">

    <div class="biomeBar">
        <span class="biomeSelect">LAGOON</span>
        <span class="biomeSelect">SHORE</span>
        <span class="biomeSelect">TWILIGHT</span>
        <span class="biomeSelect">DEEP</span>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
