<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edenshore</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Bond Display -->

    <div id="bondLabel" class="bond-bar">
        BOND: 0 - Stranger
    </div>

    <!-- Dialogue Display -->

    <div id="dialogueBox" class="dialogue-box">
        Welcome to Edenshore.
    </div>

    <!-- Main Stage -->

    <div id="terrarium">

        <img
            id="background"
            class="background"
            src="assets/images/ocean_background.png"
            alt="Ocean Background"
        >

        <!-- Solon -->

        <img
            id="solon"
            class="creature turtle"
            src="assets/images/turtle.png"
            alt="Solon"
        >

        <!-- Prism -->

        <img
            id="prism"
            class="creature fish"
            src="assets/images/fish.png"
            alt="Prism"
        >

        <!-- Lumen -->

        <img
            id="lumen"
            class="creature jellyfish"
            src="assets/images/jellyfish.png"
            alt="Lumen"
        >

        <!-- Ripple -->

        <img
            id="ripple"
            class="creature seahorse"
            src="assets/images/seahorse.png"
            alt="Ripple"
        >

        <!-- Vertex -->

        <img
            id="vertex"
            class="creature crab"
            src="assets/images/crab.png"
            alt="Vertex"
        >

    </div>

    <!-- Navigation -->

    <div class="zone-bar">

        <button
            id="lagoonBtn"
            class="zone-button"
        >
            LAGOON
        </button>

        <button
            id="shoreBtn"
            class="zone-button"
        >
            SHORE
        </button>

        <button
            id="twilightBtn"
            class="zone-button"
        >
            TWILIGHT
        </button>

        <button
            id="deepBtn"
            class="zone-button"
        >
            DEEP
        </button>

    </div>

    <script type="module" src="save.js"></script>
    <script type="module" src="bond.js"></script>
    <script type="module" src="dialogue.js"></script>
    <script type="module" src="app.js"></script>

</body>
</html>
