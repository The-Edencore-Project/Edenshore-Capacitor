<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edenshore V4.4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="top-bar">
    <div id="bond-text">BOND: 0 - Stranger</div>
</div>

<div id="dialogue-box">
    Welcome to Edenshore.
</div>

<div id="scene">

    <div id="bg-gradient" class="biome-lagoon"></div>

    <img id="pillars"
         class="parallax"
         src="assets/images/pillars.png">

    <img id="mountains"
         class="parallax"
         src="assets/images/mountains.png">

    <img id="dunes"
         class="parallax"
         src="assets/images/sand_dunes.png">

    <div id="creature-layer">

        <img id="solon"
             class="creature"
             src="assets/images/solon.png">

        <img id="prism"
             class="creature"
             src="assets/images/prism.png">

        <img id="ripple"
             class="creature"
             src="assets/images/ripple.png">

        <img id="lumen"
             class="creature"
             src="assets/images/lumen.png">

        <img id="vertex"
             class="creature"
             src="assets/images/vertex.png">

    </div>

    <img id="grass"
         class="parallax grass"
         src="assets/images/grass.png">

</div>

<div id="bottom-bar">

<button id="lagoonBtn" class="biome-btn active">LAGOON</button>
<button id="shoreBtn" class="biome-btn">SHORE</button>
<button id="twilightBtn" class="biome-btn">TWILIGHT</button>
<button id="deepBtn" class="biome-btn">DEEP</button>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
