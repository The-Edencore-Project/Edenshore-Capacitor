<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edenshore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-overlay">
        <h1>EDENSHORE</h1>
        <p>Tap anywhere to enter</p>
    </div>

    <div id="bg-gradient" class="biome-deep">
        <div id="layer-mountains" class="parallax-layer"></div>
        <div id="layer-pillars" class="parallax-layer"></div>
        <div id="layer-dunes" class="parallax-layer"></div>
        <div id="particle-layer"></div>
    </div>

    <div id="ui-layer">
        <div id="bond-text">BOND: 0 - Stranger</div>
    </div>

    <div id="creature-layer">
        <!-- Solon Group (Turtle) -->
        <div id="solon-group" style="width: 130px; height: 130px;">
            <img id="solonLeftFin" src="assets/images/solon_left_fin_1.png">
            <img id="solon" class="creature" src="assets/images/solon_body.png" data-base="assets/images/solon_body.png" data-blink="assets/images/solon_body_blink.png" data-talk="assets/images/solon_body_talk.png">
            <img id="solonRightFin" src="assets/images/solon_right_fin_1.png">
        </div>

        <!-- Other Creatures -->
        <img id="prism" class="creature" src="assets/images/prism.png" data-base="assets/images/prism.png" data-blink="assets/images/prism_blink.png" data-talk="assets/images/prism_talk.png" style="width: 160px;">
        <img id="lumen" class="creature" src="assets/images/lumen.png" data-base="assets/images/lumen.png" data-blink="assets/images/lumen_blink.png" data-talk="assets/images/lumen_talk.png" style="width: 110px;">
        <img id="ripple" class="creature" src="assets/images/ripple.png" data-base="assets/images/ripple.png" data-blink="assets/images/ripple_blink.png" data-talk="assets/images/ripple_talk.png" style="width: 90px;">
        <img id="vertex" class="creature" src="assets/images/vertex.png" data-base="assets/images/vertex.png" data-blink="assets/images/vertex_blink.png" data-talk="assets/images/vertex_talk.png" style="width: 100px;">
    </div>

    <div id="controls">
        <button id="feed-btn" class="action-btn">FEED</button>
    </div>

    <div id="biome-controls">
        <button id="lagoonBtn" class="biome-btn">LAGOON</button>
        <button id="shoreBtn" class="biome-btn">SHORE</button>
        <button id="twilightBtn" class="biome-btn">TWILIGHT</button>
        <button id="deepBtn" class="biome-btn active">DEEP</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
