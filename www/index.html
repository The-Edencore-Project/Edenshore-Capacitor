<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edenshore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- THE SPLASH SCREEN -->
  <div id="splash-screen" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #021a30; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease;">
    <h1 style="color: #0bf; font-size: 3rem; letter-spacing: 4px; text-shadow: 0 0 20px rgba(0,187,255,0.8); margin-bottom: 20px;">EDENSHORE</h1>
    <p style="color: #668; font-size: 1rem; letter-spacing: 1px;">Tap anywhere to enter</p>
  </div>

  <!-- THE SCENE -->
  <div id="scene">
    <div id="bg-gradient" class="biome-lagoon"></div>
    
    <!-- Parallax Backgrounds -->
    <img src="assets/images/pillars.png" id="pillars" class="parallax" data-speed="0.1">
    <img src="assets/images/mountains.png" id="mountains" class="parallax" data-speed="0.2">
    <img src="assets/images/sand_dunes.png" id="dunes" class="parallax" data-speed="0.4">
    <img src="assets/images/grass.png" id="grass" class="parallax" data-speed="1.0">

    <!-- The Council Lives Here -->
    <div id="creature-layer">
      <img src="assets/images/solon.png" id="solon" class="creature" data-scale="0.20">
      <img src="assets/images/lumen.png" id="lumen" class="creature" data-scale="0.18">
      <img src="assets/images/prism.png" id="prism" class="creature" data-scale="0.26">
      <img src="assets/images/ripple.png" id="ripple" class="creature" data-scale="0.36">
      <img src="assets/images/vertex.png" id="vertex" class="creature" data-scale="0.24">
    </div>
  </div>

  <!-- THE UI LAYER -->
  <div id="ui-layer">
    <div id="top-bar">
      <div id="bond-text">BOND: 0 - Stranger</div>
    </div>
    <div id="bottom-bar">
      <div class="biome-btn active" data-biome="LAGOON">LAGOON</div>
      <div class="biome-btn" data-biome="SHORE">SHORE</div>
      <div class="biome-btn" data-biome="TWILIGHT">TWILIGHT</div>
      <div class="biome-btn" data-biome="DEEP">DEEP</div>
    </div>
  </div>

  <!-- LOAD MODULES IN ORDER (No custom injection needed) -->
  <script src="save.js"></script>
  <script src="audio.js"></script>
  <script src="brain.js"></script>
  <script src="app.js"></script>
</body>
</html>
