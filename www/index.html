<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edenshore</title>

  <!-- EMBEDDED CSS - Guarantees loading -->
  <style>
    /* =====================================================================
       EDENSHORE - STYLE V5.0 (Embedded in HTML)
       Look: deep violet-navy water, glowing light pillars, drifting bubbles.
       No backdrop-filter, no animated top/left/width (Chromium M99 / Mali-G51).
       ===================================================================== */
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html {
        width: 100%; height: 100%; overflow: hidden; background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
    }

    /* SPLASH SCREEN (Bypassed for debug) */
    #splash-screen {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: #070a24; z-index: 9999;
        display: none; /* <--- BYPASSED */
        flex-direction: column; justify-content: center; align-items: center;
        transition: opacity 0.5s ease;
    }
    #splash-screen h1 { font-size: 2.5rem; letter-spacing: 4px; color: #4dc3ff; margin-bottom: 20px; }
    #splash-screen p { font-size: 1rem; color: #a0d8ef; animation: pulse 2s infinite; }
