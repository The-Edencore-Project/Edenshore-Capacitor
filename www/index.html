<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#021a30">
    <title>Edenshore</title>
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
    <!-- INLINE DIAGNOSTIC SCRIPT (Runs before anything else) -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var overlay = document.getElementById('start-overlay');
            if (overlay) {
                overlay.style.background = "red";
                overlay.innerHTML = "<h1 style='color:white;'>HTML IS LOADING</h1><p style='color:white;'>Waiting for app.js module...</p>";
            }
        });
    </script>

    <div id="start-overlay">
        <h1>EDENSHORE</h1>
        <p>Tap anywhere to enter</p>
    </div>

    <div id="bg-gradient" class="biome-lagoon">
        <div id="layer-mountains" class="parallax-layer"></div>
        <div id="layer-pillars" class="parallax-layer"></div>
        <div id="layer-dunes" class="parallax-layer"></div>
        <div id="particle-layer"></div>
    </div>

    <div id="ui-layer">
        <div id="bond-text">BOND: 0 - Stranger</div>
    </div>

    <div id="util-bar">
        <span id="btn-feed">FEED</span>
        <span id="btn-sleep">SLEEP</span>
        <span id="btn-dim">DIM</span>
        <span id="btn-vol">VOL HI</span>
        <span id="btn-menu">MENU</span>
    </div>

    <div id="debug-overlay"></div>

    <div id="creature-layer">
        <div id="solon-group">
            <img id="solonLeftFin" src="assets/images/solon_left_fin_1.png">
            <img id="solon" class="creature" src="assets/images/solon_body.png" data-base="assets/images/solon_body.png" data-blink="assets/images/solon_body_blink.png" data-talk="assets/images/solon_body_talk.png">
            <img id="solonRightFin" src="assets/images/solon_right_fin_1.png">
        </div>
        <img id="prism" class="creature" src="assets/images/prism.png" data-base="assets/images/prism.png" data-blink="assets/images/prism_blink.png" data-talk="assets/images/prism_talk.png" style="width: 150px;">
        <img id="lumen" class="creature" src="assets/images/lumen.png" data-base="assets/images/lumen.png" data-blink="assets/images/lumen_blink.png" data-talk="assets/images/lumen_talk.png" style="width: 120px;">
        <img id="ripple" class="creature" src="assets/images/ripple.png" data-base="assets/images/ripple.png" data-blink="assets/images/ripple_blink.png" data-talk="assets/images/ripple_talk.png" style="width: 160px;"> 
        <img id="vertex" class="creature" src="assets/images/vertex.png" data-base="assets/images/vertex.png" data-blink="assets/images/vertex_blink.png" data-talk="assets/images/vertex_talk.png" style="width: 120px;">
    </div>

    <canvas id="fx-canvas"></canvas>
    <div id="milestone-overlay"></div>

    <div id="biome-controls">
        <button id="lagoonBtn" class="biome-btn active">LAGOON</button>
        <button id="shoreBtn" class="biome-btn">SHORE</button>
        <button id="twilightBtn" class="biome-btn">TWILIGHT</button>
        <button id="deepBtn" class="biome-btn">DEEP</button>
    </div>

    <!-- APP.JS LOADS LAST -->
    <script type="module" src="app.js?v=9"></script>
</body>
</html>
