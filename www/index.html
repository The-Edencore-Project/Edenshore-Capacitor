<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edenshore</title>
  
  <!-- EMBEDDED CSS - Guarantees loading -->
  <style>
    /* =====================================================================
       EDENSHORE — STYLE.CSS V4.2 (Embedded in HTML)
       ===================================================================== */
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html {
        width: 100%; height: 100%; overflow: hidden; background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
    }

    /* SPLASH SCREEN */
    #splash-screen {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: #021a30; z-index: 9999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        transition: opacity 0.5s ease;
    }
    #splash-screen h1 { font-size: 2.5rem; letter-spacing: 4px; color: #4dc3ff; margin-bottom: 20px; }
    #splash-screen p { font-size: 1rem; color: #a0d8ef; animation: pulse 2s infinite; }

    /* SCENE & BIOMES */
    #scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1; }
    #bg-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: background 2s ease; }
    .biome-lagoon { background: linear-gradient(180deg, #021a30 0%, #043060 40%, #106080 70%, #20a0a0 100%); }
    .biome-shore { background: linear-gradient(180deg, #2a1a40 0%, #a04060 40%, #e07050 70%, #f0d090 100%); }
    .biome-twilight { background: linear-gradient(180deg, #0a0510 0%, #1a1028 40%, #2a1838 70%, #3a2048 100%); }
    .biome-deep { background: linear-gradient(180deg, #000000 0%, #050010 40%, #0a0020 70%, #100030 100%); }

    /* WEATHER & GOD RAYS */
    #god-rays {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.05) 20%, transparent 40%, rgba(255,255,255,0.05) 60%, transparent 80%, rgba(255,255,255,0.05) 100%);
        background-size: 200% 100%; animation: swayRays 20s infinite linear;
        pointer-events: none; z-index: 1;
    }
    #weather-tint { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; transition: background 2s ease; }

    /* PARALLAX LAYERS */
    .parallax { position: absolute; left: 0; width: 120%; height: auto; pointer-events: none; will-change: transform; }
    #pillars { bottom: 5%; opacity: 0.3; z-index: 2; }
    #mountains { bottom: 2%; opacity: 0.6; z-index: 3; }
    #dunes { z-index: 4; bottom: 0; }
    #grass { z-index: 6; opacity: 0.8; bottom: -2%; }

    /* SHADOWS */
    #shadow-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    .creature-shadow { position: absolute; background: rgba(0, 0, 0, 0.4); border-radius: 50%; filter: blur(8px); transform: translate(-50%, -50%); will-change: transform, width, height, opacity; }

    /* CREATURES (Enforced Sizing) */
    #creature-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; }
    .creature { position: absolute; pointer-events: auto; cursor: pointer; transform-origin: center center; will-change: transform; transition: transform 0.1s ease-out; width: 100px; height: auto; }
    
    /* Specific sizes based on data-scale (512 Math) */
    #solon { width: 150px; height: 150px; display: flex; justify-content: center; align-items: center; }
    #lumen { width: 92px; }
    #prism { width: 133px; }
    #ripple { width: 184px; }
    #vertex { width: 122px; }

    /* Solon Specific Layering */
    .solon-fin { position: absolute; width: 32%; height: auto; pointer-events: none; }
    #solon-left-fin { z-index: 1; transform: translate(-14%, 17%); }
    #solon-body { z-index: 2; width: 100%; height: auto; pointer-events: auto; }
    #solon-right-fin { z-index: 3; transform: translate(25%, 18%); }

    /* LUMEN TENTACLES */
    .lumen-tentacle { position: absolute; bottom: -20px; width: 4px; background: linear-gradient(to bottom, rgba(200, 150, 255, 0.6), transparent); border-radius: 50%; pointer-events: none; animation: floatTentacle 3s infinite ease-in-out alternate; }

    /* RIDDLE PULSE */
    .creature.riddle-target { animation: pulseTarget 1.5s infinite ease-in-out; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8)); }

    /* UI LAYER */
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }

    /* HUD TOP */
    #hud-top { display: flex; flex-direction: column; align-items: center; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-top: 10px; }
    #bond-text { font-size: 1.5rem; font-weight: bold; color: #4dc3ff; letter-spacing: 2px; }
    #status-text { font-size: 0.9rem; color: #a0d8ef; margin-top: 5px; }

    /* HUD UTIL */
    #hud-util { display: flex; justify-content: space-around; width: 100%; pointer-events: auto; padding: 10px 0; background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%); }
    .util-btn { color: #00ff00; font-weight: bold; font-size: 1rem; letter-spacing: 1px; cursor: pointer; padding: 10px; text-shadow: 0 0 5px rgba(0, 255, 0, 0.5); }
    .util-btn:active { transform: scale(0.95); color: #fff; text-shadow: 0 0 10px #fff; }

    /* HUD BOTTOM */
    #bottom-bar { display: flex; justify-content: space-around; width: 100%; pointer-events: auto; padding: 10px 0; background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%); }
    .biome-btn { color: #00ff00; font-weight: bold; font-size: 1rem; letter-spacing: 1px; cursor: pointer; padding: 10px; transition: all 0.3s ease; text-shadow: 0 0 5px rgba(0, 255, 0, 0.5); }
    .biome-btn.active { color: #ff3333; text-shadow: 0 0 10px rgba(255, 51, 51, 0.8); border-bottom: 2px solid #ff3333; }

    /* DYNAMIC SPEECH BUBBLES */
    .speech-bubble {
        position: absolute; transform: translate(-50%, -100%) scale(0.8);
        background: rgba(20, 30, 45, 0.85); border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px; padding: 12px 18px; max-width: 250px;
        text-align: center; font-size: 1rem; line-height: 1.3; color: #fff;
        pointer-events: none; opacity: 0;
        transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 200; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .speech-bubble.visible { opacity: 1; transform: translate(-50%, -100%) scale(1); }
    .speech-bubble::after {
        content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
        border-width: 8px 8px 0; border-style: solid;
        border-color: rgba(20, 30, 45, 0.85) transparent transparent transparent;
    }

    /* FOOD PARTICLES */
    .food-particle { position: absolute; width: 6px; height: 6px; background: #ffaa00; border-radius: 50%; box-shadow: 0 0 5px #ffaa00; pointer-events: none; z-index: 6; }

    /* DEBUG HUD */
    #debug-overlay { position: absolute; top: 120px; left: 10px; pointer-events: none; z-index: 150; }

    /* ANIMATIONS */
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes swayRays { 0% { background-position: 0% 0%; } 50% { background-position: 100% 0%; } 100% { background-position: 0% 0%; } }
    @keyframes floatTentacle { 0% { transform: translateY(0) scaleX(1); } 100% { transform: translateY(10px) scaleX(1.2); } }
    @keyframes pulseTarget { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes riseAndFade { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }
  </style>
</head>
<body>

  <div id="splash-screen">
    <h1>EDENSHORE</h1>
    <p>Tap anywhere to enter</p>
  </div>

  <div id="scene">
    <div id="bg-gradient" class="biome-lagoon"></div>
    <div id="god-rays"></div>
    <div id="weather-tint"></div>

    <img src="assets/images/pillars.png" id="pillars" class="parallax" data-speed="0.1">
    <img src="assets/images/mountains.png" id="mountains" class="parallax" data-speed="0.2">
    <img src="assets/images/sand_dunes.png" id="dunes" class="parallax" data-speed="0.4">
    <img src="assets/images/grass.png" id="grass" class="parallax" data-speed="1.0">

    <div id="shadow-layer"></div>

    <div id="creature-layer">
      <div id="solon" class="creature" data-scale="0.20">
        <img id="solon-left-fin" src="assets/images/solon_left_fin_1.png" class="solon-fin">
        <img id="solon-body" src="assets/images/solon_body.png" class="solon-body-part">
        <img id="solon-right-fin" src="assets/images/solon_right_fin_1.png" class="solon-fin">
      </div>
      <img src="assets/images/lumen.png" id="lumen" class="creature" data-scale="0.18">
      <img src="assets/images/prism.png" id="prism" class="creature" data-scale="0.26">
      <img src="assets/images/ripple.png" id="ripple" class="creature" data-scale="0.36">
      <img src="assets/images/vertex.png" id="vertex" class="creature" data-scale="0.24">
    </div>
  </div>

  <div id="ui-layer">
    <div id="hud-top">
      <div id="bond-text">BOND: 0 - Stranger</div>
      <div id="status-text"></div>
    </div>
    <div id="hud-util">
      <div class="util-btn" id="btn-feed">FEED</div>
      <div class="util-btn" id="btn-sleep">SLEEP</div>
      <div class="util-btn" id="btn-dim">DIM</div>
      <div class="util-btn" id="btn-vol">VOL HI</div>
      <div class="util-btn" id="btn-menu">MENU</div>
    </div>
    <div id="bottom-bar">
      <div class="biome-btn active" data-biome="LAGOON">LAGOON</div>
      <div class="biome-btn" data-biome="SHORE">SHORE</div>
      <div class="biome-btn" data-biome="TWILIGHT">TWILIGHT</div>
      <div class="biome-btn" data-biome="DEEP">DEEP</div>
    </div>
  </div>

  <div id="debug-overlay"></div>

  <script src="systems/save.js"></script>

</body>
</html>
