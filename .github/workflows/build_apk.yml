name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # --- THE FIX: Route Gradle through Google's Maven Mirror ---
    - name: Configure Gradle to use Google Maven Mirror
      run: |
        mkdir -p ~/.gradle/init.d
        cat << 'EOF' > ~/.gradle/init.d/google-mirror.gradle
        def mirror = "https://maven-central.storage-download.googleapis.com/maven2/"
        
        settingsEvaluated { settings ->
            settings.pluginManagement {
                repositories {
                    maven { url mirror }
                    gradlePluginPortal()
                }
            }
            settings.dependencyResolutionManagement {
                repositories {
                    maven { url mirror }
                }
            }
        }
        
        allprojects {
            buildscript {
                repositories {
                    maven { url mirror }
                }
            }
            repositories {
                maven { url mirror }
            }
        }
        EOF

    # THIS IS THE MISSING STEP: Create the native Android project
    - name: Add Android Platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    # NOW you can sync your web files to the newly created Android project
    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk